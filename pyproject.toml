[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mfm-spec-format"
version = "0.4.0"
description = "Reference parser, renderer, and linter for the MFM Spec open format"
readme = "skills/mfm-spec-local/README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
mfm-spec-lint = "mfm_spec_lint:main"

[tool.setuptools]
package-dir = {"" = "skills/mfm-spec-local"}
py-modules = ["mfm_spec_lint"]

[tool.pytest.ini_options]
testpaths = ["skills/mfm-spec-local"]
