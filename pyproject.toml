[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mfm-spec-format"
version = "0.5.3"
description = "Reference parser, renderer, and linter for the MFM Spec open format"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["PyYAML>=6.0", "pydantic>=2,<3"]

[project.scripts]
mfm-spec-lint = "mfm_spec_lint:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["mfm_spec_lint"]
packages = ["mfm_data_model", "mfm_factory_formats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
